# sway が作る環境変数(WAYLAND_DISPLAY / SWAYSOCK / DISPLAY)とロケールを
# systemd --user と D-Bus へ渡す。無いと gnome-keyring や systemd 経由の GUI が
# 画面に出せない。コアなので継承値をそのまま流し、拡張側
# config.ext.d/31-session-env-locale.conf が locale.env の値で上書きする。
# 詳細は ~/.dotfiles/CLAUDE.md の「ロケール分離」「常駐ツールの起動元マップ」。
exec dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP LANG LANGUAGE LC_ALL
