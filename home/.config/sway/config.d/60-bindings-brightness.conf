# 画面の明るさ（XF86MonBrightness キー）。
#
# ※ これは /usr/share/sway/config.d/60-bindings-brightness.conf のユーザー上書き版。
#   システム版は brightnessctl のみ（＝内蔵パネル eDP-1 専用）で、外部モニタ(DP)では
#   効かない（外部は backlight を持たず DDC/CI 制御のため）。
#   そこで brightness.py に置き換え、active な出力を見て自動で振り分ける:
#     内蔵(eDP*) → brightnessctl / 外部(DP*) → ddcutil(DDC/CI)。
#   ddcutil 未導入時は外部で「要インストール」を通知する（内蔵は常に動く）。

#: 画面の明るさを下げる（内蔵=brightnessctl / 外部=ddcutil）
bindsym XF86MonBrightnessDown exec $scripts/brightness.py down
#: 画面の明るさを上げる（内蔵=brightnessctl / 外部=ddcutil）
bindsym XF86MonBrightnessUp exec $scripts/brightness.py up
