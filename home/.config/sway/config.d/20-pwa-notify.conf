# Gmail / カレンダー PWA のウィンドウ配置ルール。
# 起動は systemd (pwa-gmail.service / pwa-calendar.service) が行うのでここでは exec しない。
# ※ PWA 自体は環境固有なので dotfiles には含めていない。作り方は README を参照。
#
# app_id は URL 由来で確定的なので確実にマッチする。フローティング化して 3 画面すべてに
# 収まる 1400x1040 に固定し、スクラッチパッドへ隠す（隠れていても通知は届き続ける）。
# 引き出しは $mod+F1 / $mod+F2（config.d/17-scratchpad.conf）。
for_window [app_id="^brave-mail\.google\.com"] floating enable, resize set 1400 1040, move scratchpad
for_window [app_id="^brave-calendar\.google\.com"] floating enable, resize set 1400 1040, move scratchpad
