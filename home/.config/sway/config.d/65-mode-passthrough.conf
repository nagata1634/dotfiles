# A special mode for passing any keybindings to the focused application
#
# ※ これは /usr/share/sway/config.d/65-mode-passthrough.conf のユーザー上書き版。
#   layered-include は同名ファイルを ~/.config 側で丸ごと優先するため、システム版の
#   内容をそのまま再現しつつ、早見表(keybind-rofi)用の `#: 説明` を各 bindsym に付与。
#   （$mod+Pause を押すとアプリへ全キーを素通しするモードに入る／同じキーで戻る）

mode "passthrough" {
    #: パススルーモードを解除（通常操作へ戻る）
    bindsym $mod+Pause mode default
}
#: パススルーモードへ（全キーをアプリに素通し）
bindsym $mod+Pause mode "passthrough"
