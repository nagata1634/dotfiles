# ───────────────────────────────────────────────────────────
# Wacom Intuos BT M — 右の縦画面(DP-6)に全画面マップ
#
# 【方針】シンプルに「右の縦画面だけに限定」する map_to_output のみ。
#  DP-6 は transform 90（回転出力）なので、map_to_output は出力の回転に
#  自動追従してペンの向きを合わせる（手動 calibration_matrix は不要）。
#  また横長のタブレット面(216×135)が回転前パネル(2560×1440)にマップされる
#  ため、縦横比の崩れも小さく円もほぼ正円で描ける。
#
# ・calibration_matrix は使わない。
#   （Sway1.11 は calibration をデバイス追加時にしか適用せず、reload で
#    書き換えても効かない＝固着する既知挙動があるため、極力使わない）
# ・向きがピッタリ来ない場合は、タブレット本体を物理的に180°回して合わせる。
# ・type:tablet_tool = ペン全般。BT 再ペアリングでも識別子非依存で効く。
#
# ・トグル(toggle-monitors.py)で縦画面が DP-5 側へ入れ替わったら、縦になった
#   出力へ map_to_output を貼り直す（apply_v 内で対応）。
#
# ※ 窓に書き込み範囲を合わせる実験機能(scripts/wacom-snap-region.py)は残置。
#   使いたくなったら bindsym を復活させる。今は全画面優先で無効化。
# ───────────────────────────────────────────────────────────
input "type:tablet_tool" {
    map_to_output DP-6
}
