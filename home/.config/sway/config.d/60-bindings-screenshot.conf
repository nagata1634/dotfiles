# このファイルは /usr/share/sway/config.d/60-bindings-screenshot.conf を
# layered-include で「上書き（shadow）」して無効化するためのもの。
# （90-bar.conf / 90-swayidle.conf と同じ手法）
#
# 理由: システム版は bindsym{} ブロックで Print / Ctrl+Print を再束縛し、
#       ユーザー側 50-screenshot.conf の同キー束縛と衝突して
#       起動/reload 時に「There are errors in your config file」
#       （line 15 …/60-bindings-screenshot.conf）を出し、
#       Print キーが無反応になっていた。
#
# スクリーンショットの操作は 50-screenshot.conf 側で一元管理する。
# ここには bindsym を一切置かない（＝システム版の束縛を打ち消す）。
