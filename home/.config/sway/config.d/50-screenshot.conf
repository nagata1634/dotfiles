# ───────────────────────────────────────────────────────────
# スクリーンショット（grimshot 使用。保存先は ~/Pictures）
#
#   Print              … 範囲を選んで保存（ドラッグで矩形選択 → ファイル）
#   Shift+Print        … 今のモニタ全体を保存
#   Ctrl+Print         … 範囲を選んでクリップボードへコピー
#   Ctrl+Shift+Print   … 今のモニタ全体をクリップボードへコピー
#
# grimshot は保存/コピー時に通知を出す。範囲選択は slurp（ドラッグ）。
# 設定ハブ($mod+Ctrl+s → スクリーンショット)からも同じ操作が可能。
# ───────────────────────────────────────────────────────────
#: スクショ: 範囲を選んで保存
bindsym Print exec grimshot save area
#: スクショ: 今のモニタ全体を保存
bindsym Shift+Print exec grimshot save output
#: スクショ: 範囲を選んでコピー
bindsym Ctrl+Print exec grimshot copy area
#: スクショ: 今のモニタ全体をコピー
bindsym Ctrl+Shift+Print exec grimshot copy output
