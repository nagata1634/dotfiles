# ───────────────────────────────────────────────────────────
# スクラッチパッド: F キー直アクセス（$mod+F…）
#
# 単押しの F キーはアプリ側(F5更新/F2改名等)を潰すので $mod+F を使用。
# 表示バインドは「トグル」: もう一度押すと隠れる。
# ※ $mod+grave（rofi一覧で選択表示）はメイン config 側で定義（重複回避）。
#
# ── 固定スロット（アプリを app_id で直指定）──
#: スクラッチパッド Gmail 表示/隠す
bindsym $mod+F1 [app_id="^brave-mail\.google\.com"]     scratchpad show
#: スクラッチパッド Googleカレンダー 表示/隠す
bindsym $mod+F2 [app_id="^brave-calendar\.google\.com"] scratchpad show
#
# ── マーク式スロット（任意のウィンドウを割り当て）──
#   $mod+Shift+F3/F4/F5 … フォーカス中のウィンドウをそのスロットに登録
#                         （マークして scratchpad へ収納）
#   $mod+F3/F4/F5       … そのスロットを表示/隠す
#   ※タブグループにしたい場合: 先に窓を並べて `layout tabbed`→`focus parent`
#     でまとめてから $mod+Shift+F3 で登録すると、その集合がタブ表示で出る。
#: スロットtabsに登録（マークして退避）
bindsym $mod+Shift+F3 mark --add "pad_tabs", move scratchpad
#: スクラッチパッド スロットtabs 表示/隠す
bindsym $mod+F3       [con_mark="pad_tabs"]   scratchpad show
#: スロットtray1に登録（マークして退避）
bindsym $mod+Shift+F4 mark --add "pad_tray1", move scratchpad
#: スクラッチパッド スロットtray1 表示/隠す
bindsym $mod+F4       [con_mark="pad_tray1"]  scratchpad show
#: スロットtray2に登録（マークして退避）
bindsym $mod+Shift+F5 mark --add "pad_tray2", move scratchpad
#: スクラッチパッド スロットtray2 表示/隠す
bindsym $mod+F5       [con_mark="pad_tray2"]  scratchpad show
#
# ── 従来の FIFO 巡回も残す ──
#: スクラッチパッドをFIFO巡回表示
bindsym $mod+Ctrl+grave scratchpad show
