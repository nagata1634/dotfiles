# ───────────────────────────────────────────────────────────
# ワークスペースの next/prev 循環切替（ブラケットキー）
#
# ● 1画面だけ（フォーカス中の画面）… $mod+] 次 / $mod+[ 前
#     右(奇数): 1→3→5→7→9→1 / 左(偶数): 2→4→6→8→10→2（同パリティ内で±2循環）
#
# ● 2画面まとめて（両画面それぞれ±2の相対移動）… $mod+Shift+] 次 / $mod+Shift+[ 前
#     (1,2)→(3,4)→(5,6)…。ズレていても各画面が独立に+2（例 (3,8)→(5,10)）。
#
# ※ 特定WSへ直接: $mod+数字（従来どおり）／ 特定ペアへ直接: $mod+Ctrl+数字（従来どおり）
# ───────────────────────────────────────────────────────────
#: WS 1画面切替 次（右1→3→5→7→9 / 左2→4→6→8→10）
bindsym $mod+bracketright       exec $scripts/ws-cycle.py single next
#: WS 1画面切替 前
bindsym $mod+bracketleft        exec $scripts/ws-cycle.py single prev
#: WS 2画面まとめて切替 次（両画面それぞれ+2）
bindsym $mod+Shift+bracketright exec $scripts/ws-cycle.py both next
#: WS 2画面まとめて切替 前（両画面それぞれ-2）
bindsym $mod+Shift+bracketleft  exec $scripts/ws-cycle.py both prev
