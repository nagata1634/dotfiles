# ───────────────────────────────────────────────────────────
# Mod+数字: 絶対マッピング + フォーカス追従（ws-goto.py 経由）
#
#   キー番号 = WS番号。奇数キー 1/3/5/7/9 → 右画面 / 偶数キー 2/4/6/8/0 → 左画面。
#   押すと対象WSの画面へ「フォーカスも」移動する
#   （左画面に居て奇数キーを押すと右画面へ切り替わる）。
#
#   eDP-1 のみ（外部未接続）の時は全WSが eDP-1 に出るのでそのまま直接切替。
#
# ※ 素の `workspace number N` は新規(空)WSを現在画面に作ってしまい別画面へ移らない
#   ため、ws-goto.py で「正しい画面を先に focus → 切替」して確実に移す。
# ※ 本体 config 側の旧 $mod+数字 切替バインドは撤去済み（重複防止）。--no-warn は
#   将来 system の config.d 等が同キーを割り当てても swaynag が出ないための保険。
#
# 各 bindsym 直前の `#: 説明` は keybind-rofi.py の早見表（$mod+Shift+/）に出る表示名。
# ───────────────────────────────────────────────────────────
#: WS1へ切替（奇数=右画面・フォーカスも移動）
bindsym --no-warn $mod+1 exec $scripts/ws-goto.py 1
#: WS2へ切替（偶数=左画面・フォーカスも移動）
bindsym --no-warn $mod+2 exec $scripts/ws-goto.py 2
#: WS3へ切替（奇数=右画面）
bindsym --no-warn $mod+3 exec $scripts/ws-goto.py 3
#: WS4へ切替（偶数=左画面）
bindsym --no-warn $mod+4 exec $scripts/ws-goto.py 4
#: WS5へ切替（奇数=右画面）
bindsym --no-warn $mod+5 exec $scripts/ws-goto.py 5
#: WS6へ切替（偶数=左画面）
bindsym --no-warn $mod+6 exec $scripts/ws-goto.py 6
#: WS7へ切替（奇数=右画面）
bindsym --no-warn $mod+7 exec $scripts/ws-goto.py 7
#: WS8へ切替（偶数=左画面）
bindsym --no-warn $mod+8 exec $scripts/ws-goto.py 8
#: WS9へ切替（奇数=右画面）
bindsym --no-warn $mod+9 exec $scripts/ws-goto.py 9
#: WS10へ切替（偶数=左画面）
bindsym --no-warn $mod+0 exec $scripts/ws-goto.py 10
