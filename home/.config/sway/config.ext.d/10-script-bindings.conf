# config 本体から移設した、自作スクリプト依存のキーバインド。
# 各 bindsym の直前行の `#: 機能名` は keybind-rofi.py が一覧表示に使う
# （Sway は行末インラインコメント不可なので前の行に書く）。

# Mod+Tab: 同じワークスペース内のウィンドウを rofi で切り替え
#: ウィンドウ切替（同一WS内・rofi）
bindsym $mod+Tab exec $scripts/sway-window-switcher.py
# Mod+Shift+Tab: ワークスペースを rofi で切り替え
#: ワークスペース切替（rofi）
bindsym $mod+Shift+Tab exec $scripts/sway-workspace-switcher.py

# モニター配置がズレたとき、DP-5/DP-6 の横/縦の役割を入れ替えるトグル。
# 同一型番で EDID シリアル無し→自動判定不能なため、見て分かる人間が手動で直す。
# Ctrl+Alt+Del を連想する覚えやすさ＋4キー同時で誤爆防止。
#: モニタの横/縦の役割を入れ替え
bindsym $mod+Ctrl+Mod1+Escape exec $scripts/toggle-monitors.py

# キーバインド一覧を rofi で表示し、選んだコマンドを実行（cheatsheet 兼ランチャー）
#: キーバインド一覧（このメニュー）
bindsym $mod+Shift+slash exec $scripts/keybind-rofi.py

# 電源メニュー（ロック/サスペンド/再起動/シャットダウン/更新 等）
#: 電源メニュー（ロック/サスペンド/電源）
bindsym $mod+x exec $scripts/power-menu.py

# 設定ハブ（WiFi/BT/音/明るさ/画面/ナイトライト/電源プロファイル/通知/SS）
#: 設定ハブ（WiFi/音/明るさ等）
bindsym $mod+Ctrl+s exec $scripts/settings-menu.py

# 通知センター（履歴の確認・再表示・おやすみ切替）
#: 通知センター（履歴/おやすみ）
bindsym $mod+Shift+n exec $scripts/notif-center.py

# スクラッチパッドを rofi 一覧から選んで表示（FIFO 巡回の代替）。
# 固定 F キー割当と FIFO 巡回はコア側 config.d/17-scratchpad.conf。
#: スクラッチパッドを選択表示
bindsym $mod+grave exec $scripts/scratchpad-menu.py
