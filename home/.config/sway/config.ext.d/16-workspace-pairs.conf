# ───────────────────────────────────────────────────────────
# ワークスペース切替の2モード
#
# ● 単一WSへ切替 …… $mod+数字（17-workspace-goto.conf / ws-goto.py 経由）
#     キー番号 = WS番号。奇数キー $mod+1/3/5/7/9 → 右(DP-6)、
#     偶数キー $mod+2/4/6/8/0 → 左(DP-5)。押すとその画面へフォーカスも移動する
#     （左に居て奇数キー → 右画面へ切替）。もう片方の画面はそのまま。
#
# ● 両画面まとめて切替（ペア）…… $mod+Ctrl+数字
#     $mod+Ctrl+1 → 右=WS1 / 左=WS2
#     $mod+Ctrl+2 → 右=WS3 / 左=WS4
#     $mod+Ctrl+3 → 右=WS5 / 左=WS6
#     $mod+Ctrl+4 → 右=WS7 / 左=WS8
#     $mod+Ctrl+5 → 右=WS9 / 左=WS10
# ───────────────────────────────────────────────────────────
#: 両画面ペア切替 右WS1/左WS2
bindsym $mod+Ctrl+1 exec $scripts/ws-pair.py 1
#: 両画面ペア切替 右WS3/左WS4
bindsym $mod+Ctrl+2 exec $scripts/ws-pair.py 2
#: 両画面ペア切替 右WS5/左WS6
bindsym $mod+Ctrl+3 exec $scripts/ws-pair.py 3
#: 両画面ペア切替 右WS7/左WS8
bindsym $mod+Ctrl+4 exec $scripts/ws-pair.py 4
#: 両画面ペア切替 右WS9/左WS10
bindsym $mod+Ctrl+5 exec $scripts/ws-pair.py 5
