# ───────────────────────────────────────────────────────────
# Rnote クイックメモ: $mod+F6
#
# ~/Pictures/Rnote/ にタイムスタンプ名の新規メモ(.rnote)を作って即開く。
# 実体は scripts/rnote-memo.sh。
# ($mod+F1〜F5 はスクラッチパッド用に使用中なので、空きの F6 を使用)
# ───────────────────────────────────────────────────────────
#: Rnoteで新規メモ（~/Pictures/Rnote/へ保存）
bindsym $mod+F6 exec $scripts/rnote-memo.sh
