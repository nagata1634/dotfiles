# ───────────────────────────────────────────────────────────
# ワークスペースの画面固定: 奇数=右(DP-6) / 偶数=左(DP-5)
#
# 外部2画面 と 内部(eDP-1) は排他。外部が無ければ eDP-1 に自動フォールバック。
# （sway の `workspace output` は列挙した中で「最初に使える出力」を選ぶ）
#
# 左右が物理的に逆なら、下の $left / $right の2行を入れ替えるだけ。
# （2台とも同型・シリアル不明のためコネクタ名で固定している）
# ───────────────────────────────────────────────────────────
set $left  DP-5
set $right DP-6
set $solo  eDP-1

workspace number 1  output $right $solo
workspace number 2  output $left  $solo
workspace number 3  output $right $solo
workspace number 4  output $left  $solo
workspace number 5  output $right $solo
workspace number 6  output $left  $solo
workspace number 7  output $right $solo
workspace number 8  output $left  $solo
workspace number 9  output $right $solo
workspace number 10 output $left  $solo

# 起動時、初期WSが "number N"（num=-1）名で作られて $mod+数字 で選べなくなる現象への
# 保険。"number N" → "N" にリネームして番号WSに正す（通常時は該当なしで無害）。
exec_always $scripts/ws-normalize.py
