# foot 設定 — WezTerm から移植（Nord配色 / GPU不使用でちらつき無し）
# server/client 運用: footclient が foot-server.socket(systemd) 経由で接続。

[main]
# フォント: Nerd Font 優先 + 日本語フォールバック（WezTerm 設定と同じ）
font=AdwaitaMono Nerd Font:size=12, Noto Sans Mono CJK JP:size=12
# 余白（WezTerm: left/right=8, top/bottom=6 相当）
pad=8x6
# 行間（単位なしはポイント指定、または px 指定）
line-height=16

[scrollback]
lines=10000

[cursor]
# WezTerm: SteadyBlock（点滅なしブロック）
style=block
blink=no

[bell]
# WezTerm: audible_bell=Disabled（音・視覚通知なし）
urgent=no
visual=no

# ============================================================
# 配色: Nord (WezTerm設定から移植・最新仕様)
# ============================================================
[colors-dark]
# 透過度設定
alpha=1.0

# 基本の色
foreground=d8dee9
background=2e3440

# カーソルの色 (最新版は [colors-dark] 内に「cursor=文字色 背景色」で記述)
cursor=2e3440 d8dee9

# 通常色 (0-7)
regular0=3b4252
regular1=bf616a
regular2=a3be8c
regular3=ebcb8b
regular4=81a1c1
regular5=b48ead
regular6=88c0d0
regular7=e5e9f0

# 明色 (8-15)
bright0=4c566a
bright1=bf616a
bright2=a3be8c
bright3=ebcb8b
bright4=81a1c1
bright5=b48ead
bright6=8fbcbb
bright7=eceff4

# 選択範囲
selection-foreground=2e3440
selection-background=81a1c1